<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Volume 01 — My Novel</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="reader-page">
  <header class="site-header">
    <a class="brand" href="../index.html">HERO OF THE DARK LEGACY</a>
    <div class="reader-header-actions">
      <a class="back-link" href="../index.html" data-i18n="home">🏠︎Home</a>
      <button class="language-btn" id="languageBtn" type="button">မြန်မာ</button>
    </div>
  </header>

  <main class="reader">
    <div class="reader-heading">
      <p class="eyebrow">VOLUME 01</p>
      <h1 id="volumeTitle">Volume One</h1>
      <p class="reader-subtitle" id="volumeSubtitle">Loading…</p>
    </div>

    <div class="music-notice" id="musicNotice" hidden>
      <strong data-i18n="optionalMusic">Optional scene music</strong>
      <span data-i18n="musicDescription">Some passages contain background music. You can mute or adjust it anytime.</span>
      <button id="dismissNotice" data-i18n="gotIt">Got it</button>
    </div>

    <div class="chapter-controls" id="chapterControls" hidden>
      <button class="chapter-arrow" id="prevChapter" type="button" aria-label="Previous chapter" data-i18n-aria="previous">←</button>
      <label class="chapter-select-wrap">
        <span data-i18n="chapter">Chapter</span>
        <select id="chapterSelect" aria-label="Choose chapter"></select>
      </label>
      <button class="chapter-arrow" id="nextChapter" type="button" aria-label="Next chapter" data-i18n-aria="next">→</button>
    </div>

    <div class="reader-loading" id="readerLoading" data-i18n="loadingStory">Loading the story…</div>
    <div class="reader-error" id="readerError" hidden></div>
    <article id="chapterContainer" class="chapter active" aria-live="polite"></article>

    <div class="reader-footer" id="readerFooter" hidden>
      <div class="bottom-chapter-nav" aria-label="Chapter navigation">
        <button class="chapter-bottom-btn" id="prevChapterBottom" type="button" data-i18n="previous">←Previous</button>
        <button class="chapter-bottom-btn" id="nextChapterBottom" type="button" data-i18n="next">Next→</button>
      </div>
      <button class="secondary-btn" id="backToTop" type="button" data-i18n="backToTop">↑ Back to top</button>
    </div>

    <div class="audio-player" id="audioPlayer" aria-live="polite">
      <div class="audio-icon">♫</div>
      <div class="audio-info">
        <strong id="audioTitle">Scene music</strong>
        <span id="audioStatus">No music playing</span>
      </div>
      <button id="muteBtn" aria-label="Mute music" data-i18n-aria="muteMusic">🔊</button>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.55" aria-label="Music volume">
      <button id="pauseBtn" aria-label="Pause music">||</button>
    </div>
  </main>

  <audio id="sceneAudio" preload="auto" loop></audio>
  <script src="../js/i18n.js"></script>
  <script src="../js/reader.js"></script>
</body>
</html>
